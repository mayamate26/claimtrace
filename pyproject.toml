[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "claimtrace-mcp"
version = "0.1.4"
description = "Check every number in an AI-written document against its source."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Maya", email = "maya@mayamate.com" }]
keywords = ["fact-checking", "llm", "hallucination", "numbers", "mcp", "citations"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Text Processing",
]
dependencies = ["httpx>=0.25", "mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
claimtrace = "claimtrace_mcp.cli:main"
claimtrace-mcp = "claimtrace_mcp.mcp_server:main"

[project.urls]
Homepage = "https://mayamate.com/claimtrace/"
Repository = "https://github.com/mayamate26/claimtrace"
Issues = "https://github.com/mayamate26/claimtrace/issues"

[tool.hatch.build.targets.wheel]
packages = ["claimtrace_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
